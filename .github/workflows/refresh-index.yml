name: Produktindex aktualisieren

# Open Food Facts wächst laufend — einmal im Monat frische Daten holen.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scripts/build-de-index.py

      - name: Commit, falls sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/de-foods.json; then
            echo "Index unverändert."
          else
            git add public/de-foods.json
            git commit -m "Produktindex aktualisiert (automatisch)"
            git push
          fi
